    <script>
      /* The wall. A layout is a tree of rows ("r") and columns ("c"). A number is a word
         set across, "3v" is word 3 running down the page, and "L" is the LinkedIn strip.
         Every word is scaled until its ink fills its tile, so a tree has a natural shape.
         To meet the window, "Erden" runs from condensed to expanded, then words letter-
         space out. Each visit composes some twelve hundred trees at random, keeps the ones
         that fill the window with every word readable, and picks one of them, then deals
         out the colours. Add ?seed=N to the address to draw a given wall again. */

          return [cs.fontStyle, cs.fontWeight, stretch, size, cs.fontFamily].join(" ");
        }

        /* Ink box and baseline of every word, per pixel of font size. The ink is found by
           drawing the word and scanning the pixels, since some browsers report only the
           advance width. A flexible word is drawn at both ends of its width axis; its ink

              canvas.height = H;

              var d = ctx.getImageData(0, 0, W, H).data;
              function hit(x, y) {
                return d[(y * W + x) * 4 + 3] > 0;

           word, or a block of two or three short lines. */
        function compose(count) {
          var ends = [12];
          while (ends.length < count) {
            var cut = 1 + Math.floor(random() * 11);
            if (ends.indexOf(cut) < 0) ends.push(cut);

                cells.push(col);

                turned++;

                j++;

            node.ls = m.track * (node.rot ? tv : th);
            node.l = m.lo.l + (m.hi.l - m.lo.l) * q;
            node.iw = m.lo.w + (m.hi.w - m.lo.w) * q + node.ls * (m.n - 1);
            var r = node.iw / m.h;
            node.a = node.rot ? 1 / r : r;
            node.b = 0;
          } else if (node.k === "L") {
            node.a = 0;
            node.b = node.across ? fr.label + 2 * fr.g : fr.lw;
          } else {
            var sa = 0;
            var sb = 0;
            node.c.forEach(function (c) {
              shape(c, p, th, tv, g, fr);
              if (node.k === "r") {
                sa += c.a;
                sb += c.b;
              } else {
                sa += 1 / c.a;
                sb += c.b / c.a;
              }
            });
            node.space.forEach(function (spaced) {
              if (spaced) sa += SPACE;
              else sb += node.k === "r" ? g : -g;
            });
            if (node.k === "r") {
              node.a = sa;
              node.b = sb;
            } else {
              node.a = 1 / sa;
              node.b = node.a * sb;
            }
          }
        }

        /* Flex first, then letter-spacing, until the tree matches the box */
        function solve(tree, W, H, g, fr) {
          function over(p, th, tv) {
            shape(tree, p, th, tv, g, fr);
            return tree.a * H + tree.b - W;
          }
          function bisect(f) {
            if (f(1) <= 0) return 1;
            if (f(0) > 0) return 0;
            var lo = 0;
            var hi = 1;
            for (var k = 0; k < 20; k++) {
              var mid = (lo + hi) / 2;
              if (f(mid) <= 0) lo = mid;
              else hi = mid;
            }
            return lo;
          }
          var p = bisect(function (x) { return over(x, 0, 0); });
          var th = 0;
          var tv = 0;
          if (p === 1) th = bisect(function (x) { return over(1, x, 0); });
          else if (p === 0 && over(0, 0, 0) > 0) tv = bisect(function (x) { return -over(0, 0, x); });
          shape(tree, p, th, tv, g, fr);
          var w = Math.min(W, tree.a * H + tree.b);
          var h = Math.min(H, (W - tree.b) / tree.a);
          return { p: p, stretch: th + tv, fill: (w * h) / (W * H) };
        }

        function place(node, x, y, w, h, g, out) {
          if (node.k !== "r" && node.k !== "c") {
            out.push({ node: node, x: x, y: y, w: w, h: h });
            return;
          }
          var c = node.c;
          if (c.length === 1) return place(c[0], x, y, w, h, g, out);
          var extra = 0;
          var i;
          if (node.k === "r") {
            var nh = h;
            var wn = node.a * h + node.b;
            if (wn <= w) extra = (w - wn) / (c.length - 1);
            else nh = (w - node.b) / node.a;
            for (i = 0; i < c.length; i++) {
              var cw = c[i].a * nh + c[i].b;
              place(c[i], x, y, cw, h, g, out);
              x += cw + (node.space[i] ? SPACE * nh : g) + extra;
            }
          } else {
            var nw = w;
            var hn = (w - node.b) / node.a;
            if (hn <= h) extra = (h - hn) / (c.length - 1);
            else nw = node.a * h + node.b;
            for (i = 0; i < c.length; i++) {
              var ch = (nw - c[i].b) / c[i].a;
              place(c[i], x, y, w, ch, g, out);
              y += ch + (node.space[i] ? SPACE * nw : g) + extra;
            }
          }
        }

        /* Font size that fills a tile */
        function size(tile) {
          var node = tile.node;
          var m = info[node.i];
          return node.rot
            ? Math.min(tile.h / node.iw, tile.w / m.h)
            : Math.min(tile.w / node.iw, tile.h / m.h);
        }

        /* How well a tree fills the window: all of it, with Erden near its normal width,
           little letter-spacing, no word thinner than a twentieth of the window's short
           side, and a LinkedIn strip long enough to read */
        function judge(spec, frame) {
          var tree = parse(spec);
          var s = solve(tree, frame.W - 2 * frame.pad, frame.H - 2 * frame.pad, frame.g, frame);
          var tiles = [];
          place(tree, frame.pad, frame.pad, frame.W - 2 * frame.pad, frame.H - 2 * frame.pad, frame.g, tiles);
          var score = 1 - 3 * (1 - s.fill) - 0.08 * Math.abs(s.p - 0.5) - 0.05 * s.stretch;
          var floor = 0.05 * Math.min(frame.W, frame.H);
          var ink = [];
          tiles.forEach(function (tile) {
            if (tile.node.k === "L") {
              score -= Math.max(0, (tile.node.across ? 48 : frame.label + frame.g) - tile.h) * 0.05;
              return;
            }
            var f = size(tile);
            ink[tile.node.i] = f * info[tile.node.i].h;
            if (tile.node.rot) score += 0.03;
            score -= Math.max(0, 16 - f) * 0.1;
            /* Turned words need more body to read */
            var least = tile.node.rot ? 1.6 * floor : floor;
            score -= 4 * Math.max(0, least - ink[tile.node.i]) / least;
          });
          /* Her name leads, the title words hold their own, and the brand does not
             outshout her */
          var loudest = Math.max.apply(null, ink);
          var name = Math.max(ink[0], ink[1]);
          score -= 0.5 * Math.max(0, 0.75 - name / loudest);
          score -= 2 * Math.max(0, 0.45 - Math.min(ink[0], ink[1]) / loudest);
          [5, 6, 7, 8, 10, 11].forEach(function (i) {
            score -= Math.max(0, 0.25 - ink[i] / loudest);
          });
          [10, 11].forEach(function (i) {
            score -= 0.2 * Math.max(0, ink[i] / name - 1);
          });
          if (Math.max(ink[2], ink[3], ink[4], ink[9]) > 0.9 * loudest) score -= 0.05;
          return { spec: spec, tiles: tiles, score: score };
        }

        function frame() {
          var W = main.clientWidth;
          var H = main.clientHeight;
          var unit = Math.min(W, H) / 100;
          var type = Math.max(16, Math.min(22, 9 + 0.9 * unit));
          link.style.fontSize = type + "px";
          return {
            W: W,
            H: H,
            pad: Math.max(12, Math.min(40, 3 * unit)),
            g: Math.max(6, Math.min(18, 1.6 * unit)),
            lw: Math.max(44, 2.6 * type),
            label: link.firstChild.offsetWidth
          };
        }

        /* OKLab, to tell whether two colours are too alike to sit side by side */
        function lab(hex) {
          var n = parseInt(hex.slice(1), 16);
          var c = [n >> 16, (n >> 8) & 255, n & 255].map(function (v) {
            v /= 255;
            return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          var l = Math.cbrt(0.4122214708 * c[0] + 0.5363325363 * c[1] + 0.0514459929 * c[2]);
          var m = Math.cbrt(0.2119034982 * c[0] + 0.6806995451 * c[1] + 0.1073969566 * c[2]);
          var s = Math.cbrt(0.0883024619 * c[0] + 0.2817188376 * c[1] + 0.6299787005 * c[2]);
          return [
            0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
            1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
            0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s
          ];
        }

        var labs = {};
        function alike(a, b) {
          var x = labs[a] || (labs[a] = lab(a));
          var y = labs[b] || (labs[b] = lab(b));
          return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) < 0.2;
        }

        /* Neighbours: next to each other in the sentence, or tiles that face each other
           across a gap */
        function neighbours(tiles, g) {
          var at = [];
          tiles.forEach(function (tile) {
            if (tile.node.k === "w") at[tile.node.i] = tile;
          });
          return at.map(function (a, i) {
            return at.map(function (b, j) {
              if (i === j) return false;
              var reach = 3 * g + 0.6 * Math.min(a.w, a.h, b.w, b.h);
              var dx = Math.max(a.x - b.x - b.w, b.x - a.x - a.w);
              var dy = Math.max(a.y - b.y - b.h, b.y - a.y - a.h);
              return Math.abs(i - j) === 1 || (dx <= reach && dy < 0) || (dy <= reach && dx < 0);
            });
          });
        }

        function clashes(set, near) {
          var count = 0;
          for (var i = 0; i < 12; i++) {
            for (var j = i + 1; j < 12; j++) if (near[i][j] && alike(set[i], set[j])) count++;
          }
          return count;
        }

        /* Deal the palette at random, then swap colours until no two neighbours look alike */
        function deal(near) {
          var hand = PALETTE.slice();
          for (var i = hand.length - 1; i > 0; i--) {
            var r = Math.floor(random() * (i + 1));
            var t = hand[i];
            hand[i] = hand[r];
            hand[r] = t;
          }
          var spare = hand.pop();
          var set = hand.concat(OWN);
          var count = clashes(set, near);
          for (var k = 0; k < 3000 && count; k++) {
            var a = Math.floor(random() * 10);
            var b = Math.floor(random() * 11);
            var c = set[a];
            if (b === 10) {
              set[a] = spare;
              spare = c;
            } else {
              set[a] = set[b];
              set[b] = c;
            }
            var n = clashes(set, near);
            if (n <= count) {
              count = n;
            } else if (b === 10) {
              spare = set[a];
              set[a] = c;
            } else {
              set[b] = set[a];
              set[a] = c;
            }
          }
          return set;
        }

        function set(tile, fr) {
          var node = tile.node;
          if (node.k === "L") {
            link.style.left = tile.x + "px";
            link.style.top = tile.y + "px";
            link.style.width = tile.w + "px";
            link.style.height = tile.h + "px";
            link.classList.toggle("across", node.across);
            return;
          }
          var m = info[node.i];
          var el = words[node.i];
          var f = size(tile);
          var cx = tile.x + tile.w / 2;
          var cy = tile.y + tile.h / 2;
          var left = cx - f * node.iw / 2 + f * node.l;
          var top = cy - f * m.h / 2 + f * (m.a - m.b);
          if (m.svg) {
            el.style.width = f * node.iw + "px";
            el.style.height = f + "px";
          } else {
            el.style.fontSize = f + "px";
            el.style.letterSpacing = node.ls * f + "px";
          }
          if (m.flex) el.style.fontStretch = 50 + 100 * node.q + "%";
          el.style.left = left + "px";
          el.style.top = top + "px";
          el.style.transformOrigin = (cx - left) + "px " + (cy - top) + "px";
          el.style.rotate = node.rot + "deg";
        }

        /* Pick a tree for the window: compose twelve hundred at random, keep the ones that
           score close to the best, and take one of those. Through a resize the tree stays
           while it still fits nearly as well as when it was picked. The pick is left on
           main as data-layout. */
        function choose(fr) {
          var found = [];
          var best = -Infinity;
          /* Tall windows want more lines than wide ones */
          var lines = 3.5 + 2.4 * (fr.H - 2 * fr.pad) / (fr.W - 2 * fr.pad);
          for (var k = 0; k < 1200; k++) {
            var count = Math.round(lines + 5 * random() - 2.5);
            var j = judge(compose(Math.max(2, Math.min(11, count))), fr);
            best = Math.max(best, j.score);
            found.push(j);
          }
          /* Group the good ones by arrangement, so that one drawn many times is no
             likelier to be picked than one drawn once */
          var groups = {};
          var keys = [];
          found.forEach(function (f) {
            if (f.score < best - 0.15) return;
            var key = JSON.stringify(f.spec).replace(/"L(h?)"/, "");
            if (!groups[key] || groups[key].score < f.score) {
              if (!groups[key]) keys.push(key);
              groups[key] = f;
            }
          });
          return groups[keys[Math.floor(random() * keys.length)]];
        }

        function layout() {
          var fr = frame();
          var now = current && judge(current.spec, fr);
          if (!now || now.score < Math.min(0.75, current.score - 0.15)) {
            current = now = choose(fr);
            main.dataset.layout = JSON.stringify(now.spec);
          }
          var tiles = now.tiles;
          var near = neighbours(tiles, fr.g);
          if (!colours || clashes(colours, near)) colours = deal(near);
          tiles.forEach(function (tile) { set(tile, fr); });
          words.forEach(function (el, i) { el.style.color = colours[i]; });
        }

        function build() {
          var items = words.concat(link);
          if (still.matches) {
            items.forEach(function (el) { el.classList.add("on"); });
            return;
          }
          var t = 0;
          items.forEach(function (el, i) {
            t += i === 0 ? 0 : i === 2 ? 420 : i === items.length - 1 ? 480 : 200;
            setTimeout(function () { el.classList.add("on"); }, t);
          });
        }

        var started = false;
        function start() {
          if (started) return;
          started = true;
          measure();
          layout();
          var queued = 0;
          window.addEventListener("resize", function () {
            cancelAnimationFrame(queued);
            queued = requestAnimationFrame(layout);
          });
          requestAnimationFrame(function () {
            requestAnimationFrame(build);
          });
        }

        /* Build once the faces are in. On a slow line, give up waiting after three
           seconds and set the wall again when they arrive. */
        Promise.all(words.map(function (el) {
          return document.fonts.load(font(el, "normal", "16px"), el.textContent);
        })).then(function () {
          return document.fonts.ready;
        }).then(function () {
          if (!started) return start();
          measure();
          layout();
        }, start);
        setTimeout(start, 3000);
      })();
    </script>
  </body>
</html>
