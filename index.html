    <script>
      document.documentElement.className = "js";

      /* The ground follows the light of the visitor's day. Keyframes are OKLCH, blended
         in OKLab. Dark and light swap in one step at 06:00 and 20:15, so no minute shows
         a muddy midtone. Add ?hour=13 to the address to pin an hour.

         The words take their colours from the ground: three hues stepping back from
         the ground's own (reds and golds by day, blues and violets by night), each at
         two strengths, and one accent from across the wheel. Each colour is as vivid
         as the screen allows at the lightness that gives it a set contrast with the
         ground, light on the dark grounds and deep on the pale ones. Philips keeps
         its blue and Avent a navy, set the same way. */
      (function () {
        var SKY = [
          [0, [0.19, 0.03, 335]],
          [5.5, [0.22, 0.045, 315]],
          [5.99, [0.26, 0.05, 330]],
          [6, [0.8, 0.05, 10]],
          [6.75, [0.87, 0.05, 15]],
          [8, [0.95, 0.03, 75]],
          [13, [0.985, 0.01, 85]],
          [18, [0.94, 0.05, 75]],
          [19.5, [0.82, 0.08, 35]],
          [20.24, [0.76, 0.08, 28]],
          [20.25, [0.32, 0.06, 320]],
          [22, [0.21, 0.035, 330]],
          [24, [0.19, 0.03, 335]]

        var WHEEL = [[-70, 0], [-70, 1], [-45, 0], [-45, 1], [-20, 0], [-20, 1], [180, 0]];
        var CONTRAST = { dark: [7.5, 4.5], light: [7.5, 3.8] };

        function lab(c) {
          var h = c[2] * Math.PI / 180;
          return [c[0], c[1] * Math.cos(h), c[1] * Math.sin(h)];
        }

        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }

        /* OKLab to linear sRGB */
        function rgb(c) {
          var l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
          var m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
          var s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.291485548 * c[2], 3);
          return [
            4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s
          ].map(function (v) {
            return Math.min(1, Math.max(0, v));
          });
        }

        function inside(c) {
          var l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
          var m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
          var s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.291485548 * c[2], 3);
          return [
            4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s
          ].every(function (v) {
            return v > -0.001 && v < 1.001;
          });
        }

        function hex(c) {
          return "#" + rgb(c).map(function (x) {
            var v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
            return Math.round(v * 255).toString(16).padStart(2, "0");
          }).join("");
        }

        function luminance(c) {
          var v = rgb(c);
          return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
        }

        /* Hue h, as vivid as sRGB allows up to chroma cap, at the lightness that gives
           contrast ratio k against the ground g */
        function tone(g, h, cap, k) {
          var dark = g[0] < 0.6;
          var gy = luminance(g) + 0.05;
          var lo = 0;
          var hi = 1;
          var c;
          for (var i = 0; i < 20; i++) {
            var L = (lo + hi) / 2;
            var a = 0;
            var b = cap;
            for (var j = 0; j < 12; j++) {
              var m = (a + b) / 2;
              if (inside(lab([L, m, h]))) a = m;
              else b = m;
            }
            c = lab([L, a, h]);
            var y = luminance(c) + 0.05;
            if ((dark ? y / gy : gy / y) < k === dark) lo = L;
            else hi = L;
          }
          return hex(c);
        }

        function scheme(hour) {
          var h = ((hour % 24) + 24) % 24;
          var i = 1;
          while (SKY[i][0] < h) i++;
          var a = SKY[i - 1];
          var b = SKY[i];
          var g = mix(lab(a[1]), lab(b[1]), (h - a[0]) / (b[0] - a[0]));
          var dark = g[0] < 0.6;
          var hue = Math.atan2(g[2], g[1]) * 180 / Math.PI;
          var k = dark ? CONTRAST.dark : CONTRAST.light;
          return {
            dark: dark,
            ground: hex(g),
            ink: tone(g, hue, 0.03, dark ? 12 : 9),
            muted: tone(g, hue, 0.03, 5),
            words: WHEEL.map(function (w) {
              return tone(g, hue + w[0], 0.17, k[w[1]]);
            }),
            philips: tone(g, 258, 0.2, k[1]),
            avent: tone(g, 268, 0.09, k[0])
          };
        }

        function hour() {
          var pinned = parseFloat(new URLSearchParams(location.search).get("hour"));
          if (!isNaN(pinned)) return pinned;
          var d = new Date();
          return d.getHours() + d.getMinutes() / 60;
        }

        function apply() {
          var t = scheme(hour());
          var root = document.documentElement;
          root.style.setProperty("--ground", t.ground);
          root.style.setProperty("--ink", t.ink);
          root.style.setProperty("--muted", t.muted);
          root.style.colorScheme = t.dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = t.ground;
          window.daylight = t;
          window.dispatchEvent(new Event("daylight"));
        }

        apply();
        setInterval(apply, 60000);
      })();

          ["c", 0, 1, ["r", 2, 3], ["r", "4v", 5], 6, 7, 8, ["r", 9, 10], ["r", 11, "Lh"]],
          ["c", ["r", 0, 1], ["r", 2, 3, 4], ["r", "5v", ["c", ["r", 6, 7, 8, 9], ["r", 10, 11]], "Lh"]],

        function tick(now) {
          raf = 0;
          var dt = last ? Math.min(40, now - last) : 16;
          last = now;
          var busy = false;
          /* The wall comes loose as the first drag starts: every word eases smaller
             over a fifth of a second */
          if (loose && give > LOOSE) {
            var t = still.matches ? 1 : Math.min(1, Math.max(0, now - loose) / 200);
            give = 1 - (1 - LOOSE) * (1 - Math.pow(1 - t, 3));
            shrink(give);
            busy = t < 1;
          }
          if (drag && drag.moved) {
            var b = drag.b;
            var cap = function (v) { return Math.max(-60, Math.min(60, v)); };
            pushed = 0;
            budget = 0.4 * dt;
            var moved = go(b, cap(drag.tx - b.x - b.w / 2), cap(drag.ty - b.y - b.h / 2), 3);
            busy = busy || pushed > 0 || Math.abs(moved[0]) + Math.abs(moved[1]) > EPS;
            drag.trail.push([now, b.x + b.w / 2, b.y + b.h / 2]);
          }
          blocks.forEach(function (b) {
            if (!b.vx && !b.vy) return;
            pushed = 0;
            var dx = b.vx * dt;
            var dy = b.vy * dt;
            var moved = go(b, dx, dy, 0);
            /* A glide that meets a wall or a jam stops dead; pushing slows it by the
               weight it pushes */
            if (Math.abs(moved[0]) < Math.abs(dx) - EPS) b.vx = 0;
            if (Math.abs(moved[1]) < Math.abs(dy) - EPS) b.vy = 0;
            var keep = Math.exp(-dt / 80) * b.m / (b.m + pushed);
            b.vx *= keep;
            b.vy *= keep;
            if (Math.hypot(b.vx, b.vy) < 0.02) b.vx = b.vy = 0;
            busy = true;
          });
          blocks.forEach(function (b) {
            b.el.style.translate = (b.x + b.w / 2 - b.ox) + "px " + (b.y + b.h / 2 - b.oy) + "px";
            if (loose && b.el !== link) b.el.style.scale = b.s;
          });
          if (busy) wake();
          else last = 0;
        }

        function point(e) {
          var r = main.getBoundingClientRect();
          return [e.clientX - r.left, e.clientY - r.top];
        }

        main.addEventListener("pointerdown", function (e) {
          if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
          var p = point(e);
          var b = at(p[0], p[1], e.pointerType === "mouse" ? 0 : 8);
          if (!b) return;
          b.vx = b.vy = 0;
          drag = { b: b, id: e.pointerId, sx: p[0], sy: p[1], x: b.x + b.w / 2, y: b.y + b.h / 2, moved: false, trail: [] };
        });

        main.addEventListener("pointermove", function (e) {
          var p = point(e);
          if (!drag) {
            if (e.pointerType === "mouse") main.style.cursor = at(p[0], p[1], 0) ? "grab" : "";
            return;
          }
          if (e.pointerId !== drag.id) return;
          var dx = p[0] - drag.sx;
          var dy = p[1] - drag.sy;
          if (!drag.moved) {
            /* Until it moves, a press on the link is a click */
            if (Math.hypot(dx, dy) < 4) return;
            drag.moved = true;
            drag.b.held = true;
            main.setPointerCapture(e.pointerId);
            document.documentElement.classList.add("grabbing");
            finish();
            if (!loose) loose = performance.now();
          }
          drag.tx = drag.x + dx;
          drag.ty = drag.y + dy;
          wake();
        });

        function release(e) {
          if (!drag || e.pointerId !== drag.id) return;
          var b = drag.b;
          b.held = false;
          if (drag.moved) {
            dragged = true;
            setTimeout(function () { dragged = false; }, 0);
            document.documentElement.classList.remove("grabbing");
            /* Let go, the box carries the speed it had over the last tenth of a second */
            var now = performance.now();
            var trail = drag.trail.filter(function (s) { return now - s[0] < 100; });
            if (!still.matches && e.type === "pointerup" && trail.length > 1) {
              var s = trail[0];
              var dt = Math.max(16, now - s[0]);
              var dx = (b.x + b.w / 2 - s[1]) / dt;
              var dy = (b.y + b.h / 2 - s[2]) / dt;
              /* At most 1.5px a millisecond */
              var k = Math.min(1, 1.5 / (Math.hypot(dx, dy) || 1));
              b.vx = dx * k;
              b.vy = dy * k;
              wake();
            }
          }
          drag = null;
        }
        main.addEventListener("pointerup", release);
        main.addEventListener("pointercancel", release);
        main.addEventListener("click", function (e) {
          if (dragged) e.preventDefault();
        }, true);
        main.addEventListener("dragstart", function (e) {
          e.preventDefault();
        });

        var items = words.concat(link);
        var timers = [];

        function build() {
          if (still.matches) return finish();
          var t = 0;
          items.forEach(function (el, i) {
            t += i === 0 ? 0 : i === 2 ? 420 : i === items.length - 1 ? 480 : 200;
            timers.push(setTimeout(function () { el.classList.add("on"); }, t));
          });
        }

        /* The first drag cuts the build short */
        function finish() {
          timers.forEach(clearTimeout);
          items.forEach(function (el) { el.classList.add("on"); });
          main.classList.add("settled");
        }

        var started = false;
        function start() {
          if (started) return;
          started = true;
          measure();
          layout();
          var queued = 0;
          window.addEventListener("resize", function () {
            cancelAnimationFrame(queued);
            queued = requestAnimationFrame(layout);
          });
          /* As the hour turns, the colours move with it */
          window.addEventListener("daylight", function () {
            if (clashes(hand, near)) hand = deal(near);
            paint();
          });
          requestAnimationFrame(function () {
            requestAnimationFrame(build);
          });
        }

        /* Build once the faces are in. On a slow line, give up waiting after three
           seconds and set the wall again when they arrive. */
        Promise.all(words.map(function (el) {
          return document.fonts.load(font(el, "normal", "16px"), el.textContent);
        })).then(function () {
          return document.fonts.ready;
        }).then(function () {
          if (!started) return start();
          measure();
          layout();
        }, start);
        setTimeout(start, 3000);
      })();
    </script>
  </body>
</html>
