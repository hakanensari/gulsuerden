    <script>
      var face = new URLSearchParams(location.search).get("name");
      document.documentElement.className = face === "2" || face === "3" ? "js name" + face : "js";

      /* The ground follows the light of the visitor's day. Keyframes are OKLCH, blended
         in OKLab. Dark and light swap in one step at 06:00 and 20:15, so no minute shows
         a muddy midtone. Add ?hour=13 to the address to pin an hour.

         The words take their colours from the ground: three hues stepping back from
         the ground's own (reds and golds by day, blues and violets by night), each at
         two strengths, and one accent from across the wheel. The key words take them
         as vivid as the screen allows, at the lightness that gives a set contrast
         with the ground, light on the dark grounds and deep on the pale ones. The
         small words take the same hues with most of the colour drained, so they sit
         back. Philips keeps its blue, toned down, and Avent a navy, set the same way. */
      (function () {
        var SKY = [
          [0, [0.19, 0.03, 335]],
          [5.5, [0.22, 0.045, 315]],
          [5.99, [0.26, 0.05, 330]],
          [6, [0.8, 0.05, 10]],
          [6.75, [0.87, 0.05, 15]],
          [8, [0.95, 0.03, 75]],
          [13, [0.985, 0.01, 85]],
          [18, [0.94, 0.05, 75]],
          [19.5, [0.82, 0.08, 35]],
          [20.24, [0.76, 0.08, 28]],
          [20.25, [0.32, 0.06, 320]],
          [22, [0.21, 0.035, 330]],
          [24, [0.19, 0.03, 335]]
        ];
        /* Hue offsets from the ground's, each with the contrast it takes (0 strong, 1 soft) */
        var WHEEL = [[-70, 0], [-70, 1], [-45, 0], [-45, 1], [-20, 0], [-20, 1], [180, 0]];
        var CONTRAST = { dark: [8, 5.5], light: [7.5, 4.5] };
        /* The same for the small words: hue offset and contrast, at a sliver of the chroma */
        var QUIET = [[-70, 0], [-70, 1], [-45, 0], [-45, 1], [-20, 0], [-20, 1]];
        var HUSH = { dark: [6.5, 5.5], light: [5.5, 4.5], chroma: 0.035 };
        /* Hairlines read fainter than their contrast says, so the small words in thin
           faces take the same quiet hues at a stronger contrast */
        var THIN = { dark: [10, 8.5], light: [8, 6.5] };

        function lab(c) {
          var h = c[2] * Math.PI / 180;
          return [c[0], c[1] * Math.cos(h), c[1] * Math.sin(h)];
        }

        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }

        /* OKLab to linear sRGB */
        function rgb(c) {
          var l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
          var m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
          var s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.291485548 * c[2], 3);
          return [
            4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s
          ].map(function (v) {
            return Math.min(1, Math.max(0, v));
          });
        }

        function inside(c) {
          var l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
          var m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
          var s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.291485548 * c[2], 3);
          return [
            4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s
          ].every(function (v) {
            return v > -0.001 && v < 1.001;
          });
        }

        function hex(c) {
          return "#" + rgb(c).map(function (x) {
            var v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
            return Math.round(v * 255).toString(16).padStart(2, "0");
          }).join("");
        }

        function luminance(c) {
          var v = rgb(c);
          return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
        }

        /* Hue h, as vivid as sRGB allows up to chroma cap, at the lightness that gives
           contrast ratio k against the ground g */
        function tone(g, h, cap, k) {
          var dark = g[0] < 0.6;
          var gy = luminance(g) + 0.05;
          var lo = 0;
          var hi = 1;
          var c;
          for (var i = 0; i < 20; i++) {
            var L = (lo + hi) / 2;
            var a = 0;
            var b = cap;
            for (var j = 0; j < 12; j++) {
              var m = (a + b) / 2;
              if (inside(lab([L, m, h]))) a = m;
              else b = m;
            }
            c = lab([L, a, h]);
            var y = luminance(c) + 0.05;
            if ((dark ? y / gy : gy / y) < k === dark) lo = L;
            else hi = L;
          }
          return hex(c);
        }

        function scheme(hour) {
          var h = ((hour % 24) + 24) % 24;
          var i = 1;
          while (SKY[i][0] < h) i++;
          var a = SKY[i - 1];
          var b = SKY[i];
          var g = mix(lab(a[1]), lab(b[1]), (h - a[0]) / (b[0] - a[0]));
          var dark = g[0] < 0.6;
          var hue = Math.atan2(g[2], g[1]) * 180 / Math.PI;
          var k = dark ? CONTRAST.dark : CONTRAST.light;
          return {
            dark: dark,
            ground: hex(g),
            ink: tone(g, hue, 0.03, dark ? 12 : 9),
            muted: tone(g, hue, 0.03, 5),
            words: WHEEL.map(function (w) {
              return tone(g, hue + w[0], 0.17, k[w[1]]);
            }),
            quiet: QUIET.map(function (w) {
              return tone(g, hue + w[0], HUSH.chroma, (dark ? HUSH.dark : HUSH.light)[w[1]]);
            }),
            thin: QUIET.map(function (w) {
              return tone(g, hue + w[0], HUSH.chroma, (dark ? THIN.dark : THIN.light)[w[1]]);
            }),
            philips: tone(g, 258, 0.1, dark ? 6 : 5),
            avent: tone(g, 268, 0.09, k[0])
          };
        }

        function hour() {
          var pinned = parseFloat(new URLSearchParams(location.search).get("hour"));
          if (!isNaN(pinned)) return pinned;
          var d = new Date();
          return d.getHours() + d.getMinutes() / 60;
        }

        function apply() {
          var t = scheme(hour());
          var root = document.documentElement;
          root.style.setProperty("--ground", t.ground);
          root.style.setProperty("--ink", t.ink);
          root.style.setProperty("--muted", t.muted);
          root.style.colorScheme = t.dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = t.ground;
          window.daylight = t;
          window.dispatchEvent(new Event("daylight"));
        }

        apply();
        setInterval(apply, 60000);
      })();
    </script>

    <script>
      /* The wall. A layout is a tree of rows ("r") and columns ("c"). A number is a word
         set across, and "3v" is word 3 running down the page. Every word is scaled
         until its ink fills its tile, so a tree has a natural shape. To meet the
         window, "Erden" runs from condensed to expanded, then words letter-space out.
         Whatever slack is left is shared among the tiles, and each word is stretched
         a little to fill its own, so the wall always runs edge to edge. Of the trees
         below, the one that fills the window best, with sizes that vary and every
         word readable, is set. */

          ["c", 0, ["r", 1, 2], ["r", ["c", ["r", 3, 4, 5], 6, ["r", 7, 8]], "9v"], ["r", 10, 11]],

          ["c", 0, 1, ["r", ["c", ["r", 2, 3], 4, 5, 6], "7v"], 8, ["r", 9, ["c", 10, 11]]],
          ["c", ["r", 0, 1], ["r", ["c", ["r", 2, 3], 4], 5], ["r", 6, 7], ["r", 8, 9, ["c", 10, 11]]],
          ["c", ["r", 0, 1], ["r", 2, 3], ["r", ["c", 4, 5], 6, 7], ["r", 8, ["c", 9, 10], 11]],

          ["c", ["r", 0, 1, ["c", 2, 3]], ["r", 4, "5v", 6], ["r", 7, 8, ["c", 9, 10], 11]],
          ["c", 0, 1, ["r", 2, 3, 4, 5], ["r", 6, "7v"], ["r", 8, 9], ["r", 10, 11]],
          ["c", 0, ["r", 1, 2], 3, ["r", ["c", 4, 5], 6], ["r", "7v", 8], ["r", ["c", 9, 10], 11]],
          ["c", ["r", 0, 1], ["r", 2, 3], ["r", ["c", 4, 5], 6], ["r", 7, ["c", 8, ["r", 9, 10, 11]]]],
          ["c", 0, 1, ["r", 2, ["c", 3, 4, 5]], ["r", 6, "7v"], ["r", 8, 9], ["r", 10, 11]]

        var tall = 0;
        var near;
        var hand;

        }

          blocks.forEach(function (a, i) {
            blocks.slice(i + 1).forEach(function (b) {
              var ox = a.hw + b.hw - Math.abs(a.x - b.x);
              var oy = a.hh + b.hh - Math.abs(a.y - b.y);
              if (ox > EPS && oy > EPS && !a.held && !b.held) sum += ox * oy;
            });
          });
          return sum;
        }

        /* Blocks a and b overlap and neither is held, as a dropped block a and what
           it landed on. First b tries going straight out, across or down, by up to
           most and as far as there is room, and takes the way that leaves less overlap
           in the whole wall. If neither does, and the way back across a is clear to
           the far side, b sets off that way and keeps to it. Failing that, a goes
           instead. A move is only kept if it leaves less overlap than before, and a
           block on its way across does not turn back, so blocks cannot shuffle to and
           fro. If nothing helps, the wall is jammed. */
        function part(a, b, most) {
          var dx = b.x - a.x;
          var dy = b.y - a.y;
          var sw = a.hw + b.hw;
          var sh = a.hh + b.hh;
          var ox = sw - Math.abs(dx);
          var oy = sh - Math.abs(dy);
          if (ox <= EPS || oy <= EPS) return;
          if (a.out || (b.out && b.out !== a)) return;
          if (b.out && nudge(b, b.ax, b.dir * Math.min(most, b.ax ? sh - b.dir * dy : sw - b.dir * dx))) return;
          b.out = null;
          var sx = dx < 0 ? -1 : 1;
          var sy = dy < 0 ? -1 : 1;
          var was = overlap();
          var spot = blocks.map(function (c) { return [c.x, c.y, c.a]; });
          var enough = Math.min(most, ox, oy) * Math.max(ox, oy) / 20;
          /* The better of a block's two straight ways out, if it leaves less overlap */
          function out(c, dir) {
            var best = [0];
            [dir * sx * ox, dir * sy * oy].forEach(function (d, ax) {
              d = Math.max(-most, Math.min(most, d));
              nudge(c, ax, d);
              var gain = was - overlap();
              blocks.forEach(function (c, i) {
                c.x = spot[i][0];
                c.y = spot[i][1];
                c.a = spot[i][2];
              });
              if (gain > best[0]) best = [gain, ax, d];
            });
            return best;
          }
          var way = out(b, 1);
          if (way[0] > enough) return nudge(b, way[1], way[2]);
          var back = [[0, -sx, sw + sw - ox], [1, -sy, sh + sh - oy]].filter(function (w) {
            return room(b, w[0], w[1], w[2]) > w[2] - EPS;
          }).sort(function (v, w) { return v[2] - w[2]; })[0];
          if (back) {
            b.out = a;
            b.ax = back[0];
            b.dir = back[1];
            return nudge(b, b.ax, b.dir * most);
          }
          var other = out(a, -1);
          if (other[0] > way[0]) nudge(a, other[1], other[2]);
          else if (way[0]) nudge(b, way[1], way[2]);
          if (Math.max(way[0], other[0]) < enough) jammed = true;
        }

        /* One step of dt ms. The held block moves by (mx, my) and the others glide
           on at their speed, slowed by the weight of what they push. What the held
           block overlaps is moved clear of it. What each block moved becomes its
           speed. Then any other two that overlap part, more gently. */
        function step(dt, mx, my) {
          blocks.forEach(function (b) {
            b.px = b.x;
            b.py = b.y;
            if (b.held) {
              b.x += mx;
              b.y += my;
              tip(b, mx, my, b.x + drag.gx, b.y + drag.gy);
            } else if (b.vx || b.vy) {
              pushed = 0;
              nudge(b, 0, b.vx * dt);
              nudge(b, 1, b.vy * dt);
              b.slow = b.m / (b.m + pushed);
            }
          });
          blocks.forEach(function (b) {
            if (drag && drag.b.held && !b.held) clear(drag.b, b, FAST * dt);
          });
          var keep = still.matches ? 0 : Math.exp(-dt / GLIDE);
          blocks.forEach(function (b) {
            b.vx = keep * (b.slow || 1) * (b.vx + (b.x - b.px) / dt) / 2;
            b.vy = keep * (b.slow || 1) * (b.vy + (b.y - b.py) / dt) / 2;
            b.slow = 0;
            var v = Math.hypot(b.vx, b.vy);
            if (v < 0.003) b.vx = b.vy = 0;
            else if (v > COAST) {
              b.vx *= COAST / v;
              b.vy *= COAST / v;
            }
          });
          /* A block on its way across another is done once clear of it, and gives
             up if the other is picked up or is no longer the one on top */
          blocks.forEach(function (b) {
            var a = b.out;
            if (a && (a.held || a.out || a.z < b.z || Math.abs(a.x - b.x) > a.hw + b.hw - EPS || Math.abs(a.y - b.y) > a.hh + b.hh - EPS)) b.out = null;
          });
          blocks.forEach(function (a, i) {
            blocks.slice(i + 1).forEach(function (b) {
              if (a.held || b.held) return;
              if (a.z > b.z) part(a, b, PART * dt);
              else part(b, a, PART * dt);
            });
          });
        }

        /* Set every word at scale s around its centre */
        function shrink(s) {
          blocks.forEach(function (b) {
            b.s = s;
            b.hw = b.w * b.s / 2 + hair;
            b.hh = b.h * b.s / 2 + hair;
          });
        }

        /* The block under a point: the one on top, if several are */
        function at(x, y, slack) {
          var hit = null;
          blocks.forEach(function (b) {
            var d = Math.max(Math.abs(x - b.x) - b.w * b.s / 2, Math.abs(y - b.y) - b.h * b.s / 2);
            if (d <= slack && (!hit || b.z >= hit.z)) hit = b;
          });
          return hit;
        }

        var drag = null;
        var dragged = false;
        var raf = 0;
        var last = 0;

        function wake() {
          if (!raf) raf = requestAnimationFrame(tick);
        }

        function tick(now) {
          raf = 0;
          var dt = last ? Math.min(34, Math.max(4, now - last)) : 16;
          last = now;
          var busy = false;
          /* The wall comes loose as the first drag starts: every word eases smaller.
             If two blocks are left on top of each other with no way apart, the words
             ease a little smaller still, until there is one. */
          if (jammed) aim = Math.max(LEAST, aim - dt / 5000);
          jammed = false;
          if (give > aim) {
            give = still.matches || give - aim < 0.001 ? aim : aim + (give - aim) * Math.exp(-dt / 70);
            shrink(give);
            busy = true;
          }
          blocks.forEach(function (b) {
            b.fx = b.x;
            b.fy = b.y;
          });
          /* The held block closes on the hand, in steps of at most 8px so that it
             pushes what it meets instead of jumping over it */
          var mx = 0;
          var my = 0;
          if (drag && drag.moved) {
            var held = drag.b;
            var w = held.w * held.s / 2 + edge;
            var h = held.h * held.s / 2 + edge;
            var f = still.matches ? 1 : 1 - Math.exp(-dt / FOLLOW);
            mx = (Math.min(Math.max(drag.tx, w), wide - w) - held.x) * f;
            my = (Math.min(Math.max(drag.ty, h), tall - h) - held.y) * f;
          }
          var n = Math.max(1, Math.ceil(Math.max(Math.abs(mx), Math.abs(my)) / 8));
          for (var i = 0; i < n; i++) step(dt / n, mx / n, my / n);
          var right = Math.exp(-dt / RIGHT);
          blocks.forEach(function (b) {
            /* A long block tips less: its ends rise 10px at most */
            var most = Math.min(5, 573 / Math.max(b.hw, b.hh));
            b.a = Math.max(-most, Math.min(most, b.a * right));
            if (Math.abs(b.a) < 0.02) b.a = 0;
            if (b.a || Math.abs(b.x - b.fx) + Math.abs(b.y - b.fy) > 0.02) busy = true;
            b.el.style.translate = (b.x - b.ox) + "px " + (b.y - b.oy) + "px";
            b.el.style.rotate = (b.rot + b.a) + "deg";
            if (aim < 1) b.el.style.scale = b.s * b.kx + " " + b.s * b.ky;
          });
          if (busy) wake();
          else last = 0;
        }

        function point(e) {
          var r = main.getBoundingClientRect();
          return [e.clientX - r.left, e.clientY - r.top];
        }

        main.addEventListener("pointerdown", function (e) {
          /* A press from the pointer that was dragging means its release was missed */
          if (drag && e.pointerId === drag.id) release({ pointerId: drag.id, type: "pointercancel" });
          if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
          var p = point(e);
          var b = at(p[0], p[1], e.pointerType === "mouse" ? 0 : 8);
          if (!b) return;
          b.vx = b.vy = 0;
          /* The block is held where it was taken */
          drag = { b: b, id: e.pointerId, sx: p[0], sy: p[1], gx: p[0] - b.x, gy: p[1] - b.y, moved: false };
        });

        main.addEventListener("pointermove", function (e) {
          var p = point(e);
          if (!drag) {
            if (e.pointerType === "mouse") main.style.cursor = at(p[0], p[1], 0) ? "grab" : "";
            return;
          }
          if (e.pointerId !== drag.id) return;
          if (!drag.moved) {
            /* A press is not a drag until it moves */
            if (Math.hypot(p[0] - drag.sx, p[1] - drag.sy) < 4) return;
            drag.moved = true;
            drag.b.held = true;
            drag.b.out = null;
            drag.b.el.style.zIndex = drag.b.z = ++top;
            main.setPointerCapture(e.pointerId);
            document.documentElement.classList.add("grabbing");
            finish();
            aim = Math.min(aim, LOOSE);
          }
          drag.tx = p[0] - drag.gx;
          drag.ty = p[1] - drag.gy;
          wake();
        });

        function release(e) {
          if (!drag || e.pointerId !== drag.id) return;
          var b = drag.b;
          if (drag.moved) {
            dragged = true;
            setTimeout(function () { dragged = false; }, 0);
            document.documentElement.classList.remove("grabbing");
            /* Let go, the block keeps its speed, and eases apart from anything it was
               dropped on */
            if (e.type !== "pointerup") b.vx = b.vy = 0;
            b.held = false;
            wake();
          }
          drag = null;
        }
        main.addEventListener("pointerup", release);
        main.addEventListener("pointercancel", release);
        main.addEventListener("lostpointercapture", function (e) {
          if (e.target === main) release(e);
        });
        main.addEventListener("click", function (e) {
          if (dragged) e.preventDefault();
        }, true);
        main.addEventListener("dragstart", function (e) {
          e.preventDefault();
        });

        var items = words.concat(foot);
        var timers = [];

        function build() {
          if (still.matches) return finish();
          var t = 0;
          items.forEach(function (el, i) {
            t += i === 0 ? 0 : i === 2 ? 420 : i === items.length - 1 ? 480 : 200;
            timers.push(setTimeout(function () { el.classList.add("on"); }, t));
          });
        }

        /* The first drag cuts the build short */
        function finish() {
          timers.forEach(clearTimeout);
          items.forEach(function (el) { el.classList.add("on"); });
          main.classList.add("settled");
        }

        var started = false;
        function start() {
          if (started) return;
          started = true;
          measure();
          layout();
          var queued = 0;
          window.addEventListener("resize", function () {
            cancelAnimationFrame(queued);
            queued = requestAnimationFrame(layout);
          });
          /* As the hour turns, the colours move with it */
          window.addEventListener("daylight", function () {
            if (clashes(hand, near)) hand = deal(near);
            paint();
          });
          requestAnimationFrame(function () {
            requestAnimationFrame(build);
          });
        }

        /* Build once the faces are in. On a slow line, give up waiting after three
           seconds. Whenever a face arrives after that, measure and set the wall
           again, unless it has been dragged loose. A face that fails to load must not
           hurry the rest, or the wall would be measured in stand-in faces and stay so. */
        function settle() {
          if (!started) return start();
          if (aim < 1) return;
          measure();
          layout();
        }
        Promise.all(words.map(function (el) {
          return document.fonts.load(font(el, "normal", "16px"), el.textContent).catch(function () {});
        })).then(function () {
          return document.fonts.ready;
        }).then(settle, settle);
        setTimeout(start, 3000);
        document.fonts.addEventListener("loadingdone", function () {
          if (started) settle();
        });
      })();
    </script>
  </body>
</html>
