      /* The colours follow the light of the visitor's day. Keyframes are OKLCH, blended
         in OKLab. Dark and light swap in one step at 06:00 and 20:15, so no minute shows
         a muddy midtone. Add ?hour=13 to the address to pin an hour. */
      (function () {
        var SKY = [
          [0, [0.19, 0.03, 335]],
          [5.5, [0.22, 0.045, 315]],
          [5.99, [0.26, 0.05, 330]],
          [6, [0.8, 0.05, 10]],
          [6.75, [0.87, 0.05, 15]],
          [8, [0.95, 0.03, 75]],
          [13, [0.985, 0.01, 85]],
          [18, [0.94, 0.05, 75]],
          [19.5, [0.82, 0.08, 35]],
          [20.24, [0.76, 0.08, 28]],
          [20.25, [0.32, 0.06, 320]],
          [22, [0.21, 0.035, 330]],
          [24, [0.19, 0.03, 335]]
        ];

        function lch2lab(c) {
          var h = c[2] * Math.PI / 180;
          return [c[0], c[1] * Math.cos(h), c[1] * Math.sin(h)];
        }

        function lab2hex(c) {
          var l = Math.pow(c[0] + 0.3963377774 * c[1] + 0.2158037573 * c[2], 3);
          var m = Math.pow(c[0] - 0.1055613458 * c[1] - 0.0638541728 * c[2], 3);
          var s = Math.pow(c[0] - 0.0894841775 * c[1] - 1.291485548 * c[2], 3);
          return "#" + [
            4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s
          ].map(function (x) {
            var v = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
            return Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, "0");
          }).join("");
        }

        function mix(a, b, t) {
          return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
        }

        function theme(hour) {
          var h = ((hour % 24) + 24) % 24;
          var i = 1;
          while (SKY[i][0] < h) i++;
          var a = SKY[i - 1];
          var b = SKY[i];
          var g = mix(lch2lab(a[1]), lch2lab(b[1]), (h - a[0]) / (b[0] - a[0]));
          var dark = g[0] < 0.6;
          var ink = dark ? "#f3e7df" : "#2a1730";
          var n = parseInt(ink.slice(1), 16);
          return {
            dark: dark,
            ground: lab2hex(g),
            ink: ink,
            accent: dark ? "#ff6b7f" : "#a81f3a",
            muted: "rgba(" + (n >> 16) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", 0.78)"
          };
        }

        function hour() {
          var pinned = parseFloat(new URLSearchParams(location.search).get("hour"));
          if (!isNaN(pinned)) return pinned;
          var d = new Date();
          return d.getHours() + d.getMinutes() / 60;
        }

          var root = document.documentElement;

          document.querySelector('meta[name="theme-color"]').content = t.ground;
        }

        apply();
        setInterval(apply, 60000);
      })();

          var cy = tile.y + tile.h / 2;
          var left = cx - f * node.iw / 2 + f * node.l;
          var top = cy - f * m.h / 2 + f * (m.a - m.b);
          el.style.fontSize = f + "px";
          el.style.letterSpacing = node.ls * f + "px";
          if (m.flex) el.style.fontStretch = 50 + 100 * node.q + "%";
          el.style.left = left + "px";
          el.style.top = top + "px";
          el.style.transformOrigin = (cx - left) + "px " + (cy - top) + "px";
          el.style.rotate = node.rot + "deg";
        }

        function layout() {
          var W = main.clientWidth;
          var H = main.clientHeight;
          var unit = Math.min(W, H) / 100;
          var pad = Math.max(12, Math.min(40, 3 * unit));
          var g = Math.max(5, Math.min(16, 1.4 * unit));
          var lw = 32;
          var best = null;
          TREES.forEach(function (spec) {
            var tree = parse(spec);
            var s = solve(tree, W - 2 * pad, H - 2 * pad, g, lw);
            var tiles = [];
            place(tree, pad, pad, W - 2 * pad, H - 2 * pad, g, tiles);
            /* Fill the window, keep Erden near its normal width, keep every word legible
               and the LinkedIn strip long enough to read */
            var score = s.fill - 0.08 * Math.abs(s.p - 0.5) - 0.05 * s.stretch;
            tiles.forEach(function (tile) {
              if (tile.node.k === "L") score -= Math.max(0, 96 - tile.h) * 0.01;
              else score -= Math.max(0, 16 - size(tile)) * 0.1;
            });
            if (!best || score > best.score) best = { tiles: tiles, score: score };
          });
          best.tiles.forEach(set);
        }

        function build() {
          var items = words.concat(link);
          if (still.matches) {
            items.forEach(function (el) { el.classList.add("on"); });
            return;
          }
          var t = 0;
          items.forEach(function (el, i) {
            t += i === 0 ? 0 : i === 2 ? 420 : i === items.length - 1 ? 480 : 200;
            setTimeout(function () { el.classList.add("on"); }, t);
          });
        }

        var started = false;
        function start() {
          if (started) return;
          started = true;
          measure();
          layout();
          var queued = 0;
          window.addEventListener("resize", function () {
            cancelAnimationFrame(queued);
            queued = requestAnimationFrame(layout);
          });
          requestAnimationFrame(function () {
            requestAnimationFrame(build);
          });
        }

        /* Build once the faces are in. On a slow line, give up waiting after three
           seconds and set the wall again when they arrive. */
        Promise.all(words.map(function (el) {
          return document.fonts.load(font(el, "normal", "16px"), el.textContent);
        })).then(function () {
          return document.fonts.ready;
        }).then(function () {
          if (!started) return start();
          measure();
          layout();
        }, start);
        setTimeout(start, 3000);
      })();
    </script>
  </body>
</html>
